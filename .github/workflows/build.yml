name: Build Geode Mod

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64
          - name: Android 64-bit
            os: ubuntu-latest
            target: Android64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Geode SDK
        uses: geode-sdk/setup-geode@v2

      - name: Build Mod
        uses: geode-sdk/build-geode-mod@v2
        with:
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
      - uses: geode-sdk/build-geode-mod/combine@v2
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
          
