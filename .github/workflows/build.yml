name: Build Geode Mod

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64
          - name: Android 64-bit
            os: ubuntu-latest
            target: Android64
          - name: Android 32-bit
            os: ubuntu-latest
            target: Android32

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          target: ${{ matrix.config.target }}
          sdk: v5.11.2

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Duration-Sorter-${{ matrix.config.target }}
          path: ${{ steps.build.outputs.build-output }}
